name: Deploy to Cloudflare

# نشر تلقائي عند push إلى main (بعد نجاح أول عملية نشر يدوية)، ويمكن تشغيله يدوياً أيضاً.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: تطبيق هجرات D1 (المخطط + البذرة)
        run: npx wrangler d1 migrations apply mahalliah-db --remote

      - name: نشر الـWorker
        run: npx wrangler deploy
