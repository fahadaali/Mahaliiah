name: Deploy to Cloudflare

# تشغيل يدوي حالياً. سيُضاف تشغيل تلقائي عند push إلى main
# بعد التأكّد من نجاح أول عملية نشر يدوية.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: تطبيق هجرات D1 (المخطط + البذرة)
        run: npx wrangler d1 migrations apply mahalliah-db --remote

      - name: نشر الـWorker
        run: npx wrangler deploy
