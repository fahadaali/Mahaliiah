name: Setup Cloudflare Resources (تشغيل يدوي لمرة واحدة)

# يُشغَّل يدوياً من تبويب Actions لإنشاء قاعدة بيانات D1 وحاوية R2.
# يتطلّب سرّي المستودع: CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: إنشاء قاعدة بيانات D1 (يتخطّى إن كانت موجودة)
        run: npx wrangler d1 create mahalliah-db || echo "قد تكون قاعدة البيانات موجودة مسبقاً — راجع القائمة أدناه"

      - name: إنشاء حاوية R2 (يتخطّى إن كانت موجودة)
        run: npx wrangler r2 bucket create mahalliah-docs || echo "قد تكون الحاوية موجودة مسبقاً"

      - name: عرض قواعد D1 (لالتقاط database_id)
        run: npx wrangler d1 list

      - name: عرض حاويات R2 (للتأكيد)
        run: npx wrangler r2 bucket list
